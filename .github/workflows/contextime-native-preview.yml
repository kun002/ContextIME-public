name: ContextIME Native Identity Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-contextime-preview:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BOOST_ROOT: ${{ github.workspace }}\_upstream\weasel\deps\boost_1_84_0
      SDKVER: 10.0.19041.0

    steps:
      - name: Checkout ContextIME
        uses: actions/checkout@v4

      - name: Read fixed product identity
        id: identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = Get-Content native/contextime.identity.json -Raw | ConvertFrom-Json
          "weasel_sha=$($identity.upstream.weaselCommit)" >> $env:GITHUB_OUTPUT
          "weasel_version=$($identity.upstream.weaselVersion)" >> $env:GITHUB_OUTPUT
          "librime_sha=$($identity.upstream.librimeCommit)" >> $env:GITHUB_OUTPUT
          "librime_version=$($identity.upstream.librimeVersion)" >> $env:GITHUB_OUTPUT
          "product_version=$($identity.product.version)" >> $env:GITHUB_OUTPUT

      - name: Checkout pinned Weasel
        uses: actions/checkout@v4
        with:
          repository: rime/weasel
          ref: ${{ steps.identity.outputs.weasel_sha }}
          path: _upstream/weasel
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact upstream commits
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $weasel = (git -C _upstream/weasel rev-parse HEAD).Trim()
          $librime = (git -C _upstream/weasel/librime rev-parse HEAD).Trim()
          if ($weasel -ne '${{ steps.identity.outputs.weasel_sha }}') {
            throw "Weasel SHA mismatch: $weasel"
          }
          if ($librime -ne '${{ steps.identity.outputs.librime_sha }}') {
            throw "librime SHA mismatch: $librime"
          }
          @(
            "weasel=$weasel",
            "librime=$librime",
            "runner=$env:ImageOS",
            "image=$env:ImageVersion"
          ) | Set-Content contextime-upstream-commits.txt

      - name: Apply ContextIME product identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./native/scripts/normalize-weasel-0.17.4.ps1 `
            -WeaselRoot _upstream/weasel
          ./native/scripts/apply-contextime-identity.ps1 `
            -WeaselRoot _upstream/weasel `
            -IdentityPath native/contextime.identity.json `
            -ReportPath contextime-identity-report.json
          git -C _upstream/weasel diff --check
          git -C _upstream/weasel diff --stat
          git -C _upstream/weasel diff | Set-Content contextime-weasel-identity.patch -Encoding utf8

      - name: Configure Visual Studio 2022 build
        shell: pwsh
        working-directory: _upstream/weasel
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item env.vs2022.bat env.bat -Force

      - name: Cache Boost 1.84.0
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: native-ime-${{ runner.os }}-boost-1.84.0-v143

      - name: Install and build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        working-directory: _upstream/weasel
        run: |
          ./install_boost.bat
          ./build.bat boost

      - name: Enter MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: ${{ env.SDKVER }}

      - name: Download pinned librime development assets
        shell: pwsh
        working-directory: _upstream/weasel
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-rime.ps1 -tag '${{ steps.identity.outputs.librime_version }}' -use dev

      - name: Build Rime data
        shell: pwsh
        working-directory: _upstream/weasel
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat data

      - name: Build patched native frontend
        shell: pwsh
        working-directory: _upstream/weasel
        run: |
          $ErrorActionPreference = 'Stop'
          $env:RELEASE_BUILD = '1'
          .\build.bat

      - name: Stage isolated system DLL and IME filenames
        shell: pwsh
        working-directory: _upstream/weasel
        run: |
          $ErrorActionPreference = 'Stop'
          $fileMap = [ordered]@{
            'weasel.dll' = 'contextime.dll'
            'weaselx64.dll' = 'contextimex64.dll'
            'weaselARM.dll' = 'contextimeARM.dll'
            'weaselARM64.dll' = 'contextimeARM64.dll'
            'weaselARM64X.dll' = 'contextimeARM64X.dll'
            'weasel.ime' = 'contextime.ime'
            'weaselx64.ime' = 'contextimex64.ime'
            'weaselARM.ime' = 'contextimeARM.ime'
            'weaselARM64.ime' = 'contextimeARM64.ime'
            'weaselARM64X.ime' = 'contextimeARM64X.ime'
          }
          foreach ($entry in $fileMap.GetEnumerator()) {
            $source = Join-Path output $entry.Key
            if (Test-Path $source) {
              Copy-Item $source (Join-Path output $entry.Value) -Force
            }
          }
          foreach ($required in @('contextime.dll', 'contextimex64.dll', 'contextime.ime', 'contextimex64.ime')) {
            if (-not (Test-Path (Join-Path output $required))) {
              throw "Required isolated system file was not staged: $required"
            }
          }

      - name: Build ContextIME installer
        shell: pwsh
        working-directory: _upstream/weasel
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = "${env:ProgramFiles(x86)}\NSIS\Bin\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "NSIS not found: $makensis" }
          & $makensis `
            '/DWEASEL_VERSION=${{ steps.identity.outputs.weasel_version }}' `
            '/DWEASEL_BUILD=0' `
            '/DPRODUCT_VERSION=${{ steps.identity.outputs.weasel_version }}.0' `
            output\install.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }

      - name: Audit installer isolation and collect evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item _upstream/weasel/output/archives/contextime-0.1.0-preview-installer.exe
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256

          $requiredFiles = @(
            '_upstream/weasel/output/contextime.dll',
            '_upstream/weasel/output/contextimex64.dll',
            '_upstream/weasel/output/contextime.ime',
            '_upstream/weasel/output/contextimex64.ime'
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) { throw "Missing isolated file: $file" }
          }

          $installerScript = Get-Content _upstream/weasel/output/install.nsi -Raw
          $forbidden = @(
            'Software\Rime\Weasel',
            'SOFTWARE\Rime\Weasel',
            'Uninstall\Weasel',
            'DeleteRegKey HKLM SOFTWARE\Rime',
            '$PROGRAMFILES64\Rime',
            '$PROGRAMFILES\Rime',
            'archives\weasel-'
          )
          foreach ($token in $forbidden) {
            if ($installerScript.Contains($token)) {
              throw "Installer isolation audit failed: $token"
            }
          }

          [PSCustomObject]@{
            file = $installer.Name
            bytes = $installer.Length
            sha256 = $hash.Hash.ToLowerInvariant()
            product = 'ContextIME'
            version = '${{ steps.identity.outputs.product_version }}'
            weasel = '${{ steps.identity.outputs.weasel_sha }}'
            librime = '${{ steps.identity.outputs.librime_sha }}'
          } | ConvertTo-Json | Set-Content contextime-installer-hash.json

          Get-Command cl, msbuild, cmake | Select-Object Name, Source | Format-Table -AutoSize | Out-String | Set-Content contextime-toolchain.txt
          cl 2>&1 | Add-Content contextime-toolchain.txt
          cmake --version | Add-Content contextime-toolchain.txt
          Get-Content contextime-upstream-commits.txt, contextime-identity-report.json, contextime-installer-hash.json

      - name: Upload ContextIME preview and source evidence
        uses: actions/upload-artifact@v4
        with:
          name: contextime-native-0.1.0-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            _upstream/weasel/output/archives/contextime-0.1.0-preview-installer.exe
            _upstream/weasel/output/LICENSE.txt
            _upstream/weasel/output/README.txt
            native/contextime.identity.json
            contextime-upstream-commits.txt
            contextime-identity-report.json
            contextime-weasel-identity.patch
            contextime-installer-hash.json
            contextime-toolchain.txt
