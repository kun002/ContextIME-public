name: ContextIME 0.1.1 Patch Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/scripts/apply-contextime-0.1.1-fixes.ps1"
      - ".github/workflows/contextime-native-0.1.1-patch-check.yml"

permissions:
  contents: read

jobs:
  patch-check:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout ContextIME
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Read upstream commit
        id: identity
        shell: pwsh
        run: |
          $identity = Get-Content native/contextime.identity.json -Raw | ConvertFrom-Json
          "weasel_sha=$($identity.upstream.weaselCommit)" >> $env:GITHUB_OUTPUT

      - name: Checkout pinned Weasel
        uses: actions/checkout@v4
        with:
          repository: rime/weasel
          ref: ${{ steps.identity.outputs.weasel_sha }}
          path: _upstream/weasel
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Apply patches with diagnostics
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./native/scripts/normalize-weasel-0.17.4.ps1 -WeaselRoot _upstream/weasel
            ./native/scripts/apply-contextime-identity.ps1 `
              -WeaselRoot _upstream/weasel `
              -IdentityPath native/contextime.identity.json `
              -ReportPath contextime-identity-report.json
            ./native/scripts/apply-contextime-0.1.1-fixes.ps1 -WeaselRoot _upstream/weasel

            $diffOutput = git -C _upstream/weasel diff --check 2>&1
            $diffCode = $LASTEXITCODE
            $diffOutput | Set-Content patch-diff-check.txt
            git -C _upstream/weasel diff --stat | Set-Content patch-diff-stat.txt
            if ($diffCode -ne 0) {
              throw "git diff --check failed with exit code $diffCode"
            }
            'success' | Set-Content patch-result.txt
          } catch {
            $_ | Format-List * -Force | Out-String | Set-Content patch-error.txt
            $_.ScriptStackTrace | Set-Content patch-stack.txt
            'failure' | Set-Content patch-result.txt
          }
          $global:LASTEXITCODE = 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contextime-0.1.1-patch-diagnostics
          retention-days: 3
          if-no-files-found: warn
          path: |
            patch-result.txt
            patch-error.txt
            patch-stack.txt
            patch-diff-check.txt
            patch-diff-stat.txt
            contextime-identity-report.json
            contextime-0.1.1-fix-report.json

      - name: Fail on patch error
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path patch-result.txt) -or (Get-Content patch-result.txt -Raw).Trim() -ne 'success') {
            if (Test-Path patch-error.txt) { Get-Content patch-error.txt }
            if (Test-Path patch-diff-check.txt) { Get-Content patch-diff-check.txt }
            throw 'ContextIME 0.1.1 patch failed; see diagnostic artifact.'
          }
